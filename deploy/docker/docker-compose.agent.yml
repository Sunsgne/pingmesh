# PingMesh Agent 节点: 仅探测, Web 默认关闭
services:
  pingmesh-agent:
    image: pingmesh:local
    container_name: pingmesh-agent
    environment:
      - TZ=Asia/Shanghai
      # 接入令牌走环境变量, 不出现在进程命令行(docker inspect 仍可见, 仅限 root)
      - PINGMESH_JOIN_TOKEN=${JOIN_TOKEN:?请设置 PINGMESH_JOIN_TOKEN 或 JOIN_TOKEN}
    network_mode: host
    cap_add:
      - NET_RAW
    command:
      - -p
      - "8899"
      - -join
      - "${MASTER_URL:-http://10.100.1.8:8899}"
      - -name
      - "${NODE_NAME:-agent}"
      - -addr
      - "${NODE_ADDR:-127.0.0.1}"
      - -masters
      - "${MASTERS:-10.100.1.8:8899,10.100.1.2:8899}"
    volumes:
      - ./data/conf:/app/conf
      - ./data/db:/app/db
      - ./data/logs:/app/logs
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8899/healthz"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
