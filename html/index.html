<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>概览 - ZENLENET PingMesh</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico">
<link href="assets/css/modern.css?v=20260901c" rel="stylesheet">
</head>
<body>
<div id="app">

  <div class="grid cols-4 mb-4">
    <div class="card stat-card">
      <div class="icon ic-indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M7.5 8 10 15M16.5 8 14 15M8 6h8"/></svg></div>
      <div><div class="val" id="st-agents">-</div><div class="lbl">监测节点</div></div>
    </div>
    <div class="card stat-card">
      <div class="icon ic-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
      <div><div class="val" id="st-targets">-</div><div class="lbl">监测目标</div></div>
    </div>
    <div class="card stat-card">
      <div class="icon ic-yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div><div class="val" id="st-delay">-</div><div class="lbl" id="st-delay-lbl">平均延迟 (近2小时)</div></div>
    </div>
    <div class="card stat-card">
      <div class="icon ic-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
      <div><div class="val" id="st-bad">-</div><div class="lbl" id="st-bad-lbl">异常目标 (近2小时)</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>正向 Ping 监控</h3>
      <span class="sub">点击图表查看历史曲线，支持自定义时间范围</span>
      <span class="spacer"></span>
      <span class="muted" id="loading"></span>
    </div>
    <div class="card-body">
      <div class="page-toolbar" id="time-toolbar">
        <span class="tb-label">时间</span>
        <div class="time-toolbar-main">
          <div class="seg" id="win-seg">
            <button type="button" data-v="15">15分钟</button>
            <button type="button" data-v="60">1小时</button>
            <button type="button" data-v="120" class="active">2小时</button>
            <button type="button" data-v="360">6小时</button>
            <button type="button" data-v="1440">24小时</button>
            <button type="button" data-v="custom">自定义</button>
          </div>
          <span id="custom-range" class="time-custom" style="display:none">
            <input type="datetime-local" class="input" id="cr-start">
            <span class="muted">~</span>
            <input type="datetime-local" class="input" id="cr-end">
            <button type="button" class="btn primary sm" id="cr-apply">应用</button>
          </span>
        </div>
        <span class="spacer"></span>
        <span class="muted" id="range-hint" style="font-size:11.5px"></span>
        <span class="muted time-tz" style="font-size:11.5px">北京时间 (UTC+8)</span>
      </div>
      <div class="chips mb-4" id="agent-chips"></div>
      <div class="grid cols-3" id="charts"></div>
      <div class="empty-state" id="empty" style="display:none">
        <div class="big">&#128225;</div>
        当前节点没有配置监测目标，请到「系统配置 - 节点管理」中添加
      </div>
    </div>
  </div>

</div>

<script src="assets/js/jquery-1.7.2.min.js"></script>
<script src="assets/js/echarts.min.js"></script>
<script src="assets/js/app.js?v=20260902a"></script>
<script>
$(function () {
SP.init('index', '概览').done(function (ctx) {
    var rootCfg = ctx.config;
    var miniCharts = [];
    var timeMins = 120, timeCustom = null;
    var currentAgent = { addr: null, cfg: null, isSelf: false };

    try {
        var saved = JSON.parse(localStorage.getItem('index-time') || 'null');
        if (saved) {
            if (saved.custom && saved.custom.start && saved.custom.end) {
                timeCustom = saved.custom;
                timeMins = 120;
            } else if (saved.mins) {
                timeMins = saved.mins;
                timeCustom = null;
            }
        }
    } catch (e) {}

    function saveTimePref() {
        try {
            localStorage.setItem('index-time', JSON.stringify({ mins: timeMins, custom: timeCustom }));
        } catch (e2) {}
    }

    function currentRange() {
        if (timeCustom) return timeCustom;
        return SP.rangeFromPreset(timeMins);
    }

    function syncTimeUI() {
        var label = SP.timeWindowLabel(timeCustom ? null : timeMins, timeCustom);
        $('#st-delay-lbl').text('平均延迟 (' + label + ')');
        $('#st-bad-lbl').text('异常目标 (' + label + ')');
        if (timeCustom) {
            $('#win-seg button').removeClass('active');
            $('#win-seg button[data-v="custom"]').addClass('active');
            $('#custom-range').css('display', 'inline-flex');
            $('#cr-start').val(timeCustom.start.replace(' ', 'T'));
            $('#cr-end').val(timeCustom.end.replace(' ', 'T'));
            $('#range-hint').hide();
        } else {
            $('#custom-range').hide();
            $('#win-seg button').removeClass('active');
            $('#win-seg button[data-v="' + timeMins + '"]').addClass('active');
            var r = currentRange();
            $('#range-hint').text(r.start + ' ~ ' + r.end).show();
        }
    }

    function applyTimeRange() {
        saveTimePref();
        syncTimeUI();
        if (currentAgent.addr) {
            drawStats(currentAgent.addr, currentAgent.cfg, currentAgent.isSelf);
            drawCharts(currentAgent.addr, currentAgent.cfg, currentAgent.isSelf);
        }
    }

    $('#win-seg button').click(function () {
        var v = $(this).attr('data-v');
        if (v === 'custom') {
            $('#win-seg button').removeClass('active');
            $(this).addClass('active');
            $('#custom-range').css('display', 'inline-flex');
            $('#range-hint').hide();
            if (!$('#cr-start').val()) {
                var r = SP.rangeFromPreset(360);
                $('#cr-start').val(r.start.replace(' ', 'T'));
                $('#cr-end').val(r.end.replace(' ', 'T'));
            }
            return;
        }
        timeCustom = null;
        timeMins = parseInt(v, 10);
        applyTimeRange();
    });

    $('#cr-apply').click(function () {
        var s = $('#cr-start').val(), e = $('#cr-end').val();
        if (!s || !e) { SP.toast('请选择起止时间', 'err'); return; }
        if (s >= e) { SP.toast('结束时间需晚于开始时间', 'err'); return; }
        timeCustom = { start: s.replace('T', ' '), end: e.replace('T', ' ') };
        applyTimeRange();
    });

    renderChips(rootCfg.Addr);
    syncTimeUI();
    loadAgent(rootCfg.Addr);

    function renderChips(activeAddr) {
        var box = $('#agent-chips').empty();
        $.each(SP.sourceNodes(rootCfg), function (_, n) {
            var chip = $('<span class="chip' + (n.Addr === activeAddr ? ' active' : '') + '">' + SP.esc(n.Name) + '</span>');
            chip.click(function () {
                $('#agent-chips .chip').removeClass('active');
                chip.addClass('active');
                loadAgent(n.Addr);
            });
            box.append(chip);
        });
    }

    function loadAgent(addr) {
        var isSelf = (addr === rootCfg.Addr);
        var base = isSelf ? '' : '/api/proxy.json?g=http://' + addr + ':' + rootCfg.Port;
        $('#loading').html('<span class="spinner"></span>');
        $.getJSON(base + '/api/config.json').done(function (cfg) {
            currentAgent = { addr: addr, cfg: cfg, isSelf: isSelf };
            drawStats(addr, cfg, isSelf);
            drawCharts(addr, cfg, isSelf);
        }).fail(function () {
            $('#loading').html('');
            SP.toast('无法连接节点 ' + addr, 'err');
        });
    }

    function meshUrl(addr, isSelf) {
        if (isSelf) return '/api/pingmesh.json' + SP.meshQueryString(timeCustom ? null : timeMins, timeCustom);
        return SP.proxyMeshUrl(addr, rootCfg.Port, timeCustom ? null : timeMins, timeCustom);
    }

    function drawStats(addr, cfg, isSelf) {
        $('#st-agents').text(SP.sourceNodes(rootCfg).length);
        var self = cfg.Network[cfg.Addr] || {};
        $('#st-targets').text((self.Ping || []).length);
        $.getJSON(meshUrl(addr, isSelf), function (row) {
            var sum = 0, n = 0, bad = 0;
            $.each(row.cells, function (_, c) {
                sum += c.avgdelay; n++;
                if (SP.delayLevel(c.avgdelay, c.loss, c.baseline) >= 3) bad++;
            });
            $('#st-delay').text(n > 0 ? SP.fmtMs(sum / n) + ' ms' : '-');
            $('#st-bad').text(n > 0 ? bad : '-');
        });
    }

    function drawCharts(addr, cfg, isSelf) {
        $.each(miniCharts, function (_, c) { c.dispose(); });
        miniCharts = [];
        var box = $('#charts').empty();
        var self = cfg.Network[cfg.Addr] || {};
        var targets = self.Ping || [];
        var range = currentRange();
        $('#empty').toggle(targets.length === 0);
        $('#loading').html('');

        $.each(targets, function (i, t) {
            var tname = SP.nodeName(cfg, t);
            var id = 'mini-' + i;
            var card = $(
                '<div class="card ping-card">' +
                '<div class="ping-head"><span class="t">' + SP.esc(cfg.Name) + ' &rarr; ' + SP.esc(tname) + '</span></div>' +
                '<div class="mini-chart" id="' + id + '"></div>' +
                '<div class="ping-foot">' +
                '<span class="badge gray mono">' + SP.esc(t) + '</span>' +
                '<span class="badge indigo" id="' + id + '-delay">- ms</span>' +
                '<span class="badge green" id="' + id + '-loss">丢包率 -</span>' +
                '<span class="badge gray" id="' + id + '-asn" style="display:none"></span>' +
                '</div></div>');
            box.append(card);

            var apiurl = isSelf ? '/api/ping.json?ip=' + t
                : '/api/proxy.json?g=http://' + addr + ':' + rootCfg.Port + '/api/ping.json?ip=' + t;
            var dataUrl = SP.pingUrlWithRange(apiurl, range.start, range.end);
            card.click(function () {
                SP.openPingChart(cfg.Name + ' → ' + tname + ' (' + t + ')', apiurl, range.start, range.end);
            });
            SP.asn(t, function (info) {
                if (info) $('#' + id + '-asn').text(SP.asnShort(info)).attr('title', 'AS' + info.asn + ' ' + info.holder + ' ' + (info.prefix || '')).show();
            });

            var chart = echarts.init(document.getElementById(id));
            miniCharts.push(chart);
            if (SP.bindChartResize) SP.bindChartResize(miniCharts);
            try {
                chart.setOption(SP.miniChartOption ? SP.miniChartOption() : {});
            } catch (err) {
                console.error('mini chart init', err);
            }
            $.getJSON(dataUrl, function (d) {
                var labels = SP.chartAxisLabels(d.lastcheck || []);
                var avg = SP.sanitizeSeries ? SP.sanitizeSeries(d.avgdelay) : d.avgdelay;
                var loss = SP.sanitizeSeries ? SP.sanitizeSeries(d.losspk) : d.losspk;
                try {
                    chart.setOption(SP.miniChartDataOption
                        ? SP.miniChartDataOption(labels, avg, loss)
                        : { xAxis: { data: labels }, series: [{ name: '延迟', data: avg }, { name: '丢包率', data: loss }] });
                    chart.resize();
                } catch (err2) {
                    console.error('mini chart data', err2);
                }
                var m = SP.lastMetric ? SP.lastMetric(d.avgdelay, d.losspk) : { delay: '-', loss: '-', lossRaw: null };
                $('#' + id + '-delay').text(m.delay + ' ms');
                var lossTxt = m.lossRaw != null ? SP.fmtLossPct(m.lossRaw) : m.loss;
                var lossBadge = $('#' + id + '-loss').text('丢包率 ' + lossTxt);
                var lossVal = m.lossRaw != null ? m.lossRaw : 0;
                if (lossVal >= 20) lossBadge.removeClass('green yellow').addClass('red');
                else if (lossVal >= 5) lossBadge.removeClass('green red').addClass('yellow');
                else lossBadge.removeClass('red yellow').addClass('green');
            }).fail(function () {
                $('#' + id + '-delay').text('失败');
            });
        });
    }
});
});
</script>
</body>
</html>
